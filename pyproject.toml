[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dithercal-sar"
version = "0.1.0"
description = "Complementary-dither SAR ADC calibration implementation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7", "scikit-learn>=1.3", "joblib>=1.3"]

[project.scripts]
dithercal = "dithercal.cli:main"

[tool.setuptools.packages.find]
include = ["dithercal*"]
